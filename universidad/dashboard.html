<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniPlataforma — Dashboard</title>
  <link rel="stylesheet" href="assets/css/uni.css"/>
  <link rel="stylesheet" href="assets/css/main.css"/>
  <style>
    /* ── SIDEBAR ── */
    .sidebar { width:260px;background:linear-gradient(180deg,#1e3a8a 0%,#1e1b4b 100%);height:100vh;position:fixed;left:0;top:0;display:flex;flex-direction:column;z-index:100;overflow-y:auto;transition:transform .3s; }
    .sidebar-logo { padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px; }
    .logo-ic { width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0; }
    .logo-txt { color:#fff;font-weight:700;font-size:15px;line-height:1.2; }
    .logo-sub { color:rgba(255,255,255,.5);font-size:10px; }
    .sidebar-user { padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px; }
    .s-avatar { width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0; }
    .s-name { color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .s-role { color:rgba(255,255,255,.5);font-size:11px; }
    .sidebar-nav { flex:1;padding:10px 0; }
    .nav-sec { padding:8px 20px 3px;color:rgba(255,255,255,.4);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase; }
    .nav-item { display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.75);cursor:pointer;transition:all .18s;border-left:3px solid transparent;font-size:13.5px;user-select:none; }
    .nav-item:hover { background:rgba(255,255,255,.08);color:#fff;border-left-color:rgba(255,255,255,.3); }
    .nav-item.active { background:rgba(255,255,255,.14);color:#fff;border-left-color:#60a5fa; }
    .nav-item .ni { width:20px;text-align:center;font-size:15px;flex-shrink:0; }
    .nav-item .nb { margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px; }
    .sidebar-foot { padding:12px 20px;border-top:1px solid rgba(255,255,255,.1);margin-top:auto; }
    .btn-logout { width:100%;display:flex;align-items:center;gap:8px;color:#fca5a5;background:none;border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit; }
    .btn-logout:hover { background:rgba(239,68,68,.25);color:#fff; }

    /* ── TOPBAR ── */
    .topbar { height:64px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .tb-title { font-size:18px;font-weight:700;color:#1e293b; }
    .tb-sub { font-size:12px;color:#64748b; }
    .tb-actions { display:flex;align-items:center;gap:10px;margin-left:auto; }
    .tb-search { display:flex;align-items:center;gap:8px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:9px;padding:7px 14px;width:190px; }
    .tb-search input { background:transparent;border:none;outline:none;font-size:13px;color:#1e293b;width:100%;font-family:inherit; }
    .ic-btn { width:38px;height:38px;border-radius:9px;border:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative;transition:background .15s; }
    .ic-btn:hover { background:#f8fafc; }
    .ic-btn .dot { position:absolute;top:5px;right:5px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid #fff; }
    .tb-user { display:flex;align-items:center;gap:8px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:9px;padding:6px 12px;cursor:pointer;transition:background .15s; }
    .tb-user:hover { background:#e2e8f0; }
    .tb-av { width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700; }
    .tb-name { font-size:13px;font-weight:600;color:#334155; }

    /* ── LAYOUT ── */
    .app-wrap { display:flex;min-height:100vh; }
    .content-area { margin-left:260px;flex:1;display:flex;flex-direction:column;min-height:100vh;background:#f1f5f9; }
    .main-content { padding:24px;flex:1; }

    /* ── VIEWS ── */
    .view { display:none; }
    .view.active { display:block;animation:vfade .25s ease; }
    @keyframes vfade { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }

    /* ── NOTIF PANEL ── */
    .notif-panel { display:none;position:fixed;right:16px;top:68px;width:310px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.15);border:1px solid #e2e8f0;z-index:200; }
    .notif-panel.open { display:block; }
    .notif-head { display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #f1f5f9; }
    .notif-head span { font-weight:700;font-size:13px; }
    .notif-head button { font-size:11px;color:#2563eb;background:none;border:none;cursor:pointer; }
    .notif-item { display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid #f8fafc;transition:background .15s; }
    .notif-item:hover { background:#f8fafc; }
    .notif-ic { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0; }
    .notif-txt p { font-size:12px;font-weight:600;color:#1e293b; }
    .notif-txt span { font-size:11px;color:#64748b; }
    .notif-txt small { font-size:10px;color:#94a3b8;display:block;margin-top:2px; }
    .notif-dot { width:8px;height:8px;background:#3b82f6;border-radius:50%;margin-top:4px;flex-shrink:0; }

    /* ── CARDS ── */
    .card { background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden; }
    .card-hd { padding:15px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px; }
    .card-ttl { font-size:15px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:6px; }
    .card-bd { padding:20px; }

    /* ── STATS ── */
    .stat-card { background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;align-items:center;gap:14px;transition:transform .18s,box-shadow .18s; }
    .stat-card:hover { transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.1); }
    .stat-ic { width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0; }
    .stat-v { font-size:25px;font-weight:800;line-height:1; }
    .stat-l { font-size:12px;color:#64748b;margin-top:3px; }
    .stat-ch { font-size:11px;font-weight:600;margin-top:3px; }
    .up { color:#059669; } .dn { color:#dc2626; }

    /* ── HERO ── */
    .hero { background:linear-gradient(135deg,#1e3a8a,#4338ca);border-radius:16px;padding:24px;margin-bottom:24px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px; }
    .hero-period { font-size:12px;color:rgba(255,255,255,.7);margin-bottom:4px; }
    .hero-title { font-size:22px;font-weight:900; }
    .hero-sub { font-size:13px;color:rgba(255,255,255,.7);margin-top:2px; }
    .hero-badge { background:rgba(255,255,255,.18);border-radius:10px;padding:8px 16px;text-align:center; }
    .hero-badge-v { font-size:22px;font-weight:900; }
    .hero-badge-l { font-size:10px;color:rgba(255,255,255,.7);margin-top:2px; }

    /* ── QUICK ACCESS ── */
    .qa-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:12px; }
    .qa-btn { display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:12px;border:1.5px solid #e2e8f0;background:#fff;cursor:pointer;transition:all .18s;font-family:inherit; }
    .qa-btn:hover { border-color:#93c5fd;background:#eff6ff;transform:translateY(-2px); }
    .qa-ic { width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;transition:transform .18s; }
    .qa-btn:hover .qa-ic { transform:scale(1.1); }
    .qa-lbl { font-size:11px;font-weight:700;color:#475569;text-align:center; }

    /* ── TABS ── */
    .tabs-bar { display:flex;background:#fff;border-radius:12px;padding:4px 8px;margin-bottom:20px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .tabs-bar::-webkit-scrollbar { display:none; }
    .t-btn { padding:9px 18px;font-size:13px;font-weight:600;color:#64748b;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;font-family:inherit; }
    .t-btn:hover { color:#1e3a8a; }
    .t-btn.active { color:#1e3a8a;border-bottom-color:#1e3a8a; }

    /* ── BADGES ── */
    .bs { display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600; }
    .bg-g { background:#dcfce7;color:#15803d; }
    .bg-r { background:#fee2e2;color:#b91c1c; }
    .bg-y { background:#fef9c3;color:#854d0e; }
    .bg-b { background:#dbeafe;color:#1d4ed8; }
    .bg-p { background:#ede9fe;color:#6d28d9; }
    .bg-s { background:#f1f5f9;color:#475569; }
    .bg-o { background:#ffedd5;color:#c2410c; }

    /* ── TABLES ── */
    .tbl { width:100%;border-collapse:collapse; }
    .tbl th { background:#f8fafc;padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e2e8f0; }
    .tbl td { padding:11px 14px;font-size:13.5px;color:#334155;border-bottom:1px solid #f1f5f9; }
    .tbl tr:last-child td { border-bottom:none; }
    .tbl tr:hover td { background:#f8fafc; }
    .overflow-x { overflow-x:auto; }

    /* ── BUTTONS ── */
    .btn { display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;border:none;white-space:nowrap;font-family:inherit; }
    .b-primary { background:#1e3a8a;color:#fff; } .b-primary:hover { background:#1e40af; }
    .b-secondary { background:#f1f5f9;color:#475569;border:1px solid #e2e8f0; } .b-secondary:hover { background:#e2e8f0; }
    .b-success { background:#059669;color:#fff; } .b-success:hover { background:#047857; }
    .b-danger { background:#dc2626;color:#fff; } .b-danger:hover { background:#b91c1c; }
    .b-outline { background:transparent;color:#1e3a8a;border:1.5px solid #1e3a8a; } .b-outline:hover { background:#1e3a8a;color:#fff; }
    .b-sm { padding:4px 10px;font-size:12px; }
    .b-lg { padding:11px 22px;font-size:14px; }

    /* ── FORMS ── */
    .f-group { margin-bottom:14px; }
    .f-label { display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px; }
    .f-ctrl { width:100%;border:1.5px solid #d1d5db;border-radius:8px;padding:9px 12px;font-size:13.5px;color:#1e293b;background:#fff;outline:none;transition:border-color .18s;font-family:inherit; }
    .f-ctrl:focus { border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1); }
    .f-ctrl::placeholder { color:#9ca3af; }

    /* ── PROGRESS ── */
    .prog-bar { height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden; }
    .prog-fill { height:100%;border-radius:999px;transition:width .5s; }

    /* ── NOTA CIRCLE ── */
    .nc { width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid; }
    .nc-ok { border-color:#059669;color:#059669;background:#dcfce7; }
    .nc-fail { border-color:#dc2626;color:#dc2626;background:#fee2e2; }
    .nc-pend { border-color:#d97706;color:#d97706;background:#fef9c3; }

    /* ── MODAL ── */
    .modal-ov { position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s; }
    .modal-ov.open { opacity:1;pointer-events:all; }
    .modal-box { background:#fff;border-radius:16px;width:90%;max-width:580px;max-height:90vh;overflow-y:auto;transform:scale(.95);transition:transform .2s; }
    .modal-ov.open .modal-box { transform:scale(1); }
    .modal-hd { padding:18px 22px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between; }
    .modal-ttl { font-size:16px;font-weight:700; }
    .modal-x { width:30px;height:30px;border-radius:7px;border:none;background:#f1f5f9;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center; }
    .modal-x:hover { background:#e2e8f0; }
    .modal-bd { padding:22px; }
    .modal-ft { padding:14px 22px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:10px; }

    /* ── TOAST ── */
    .toast { position:fixed;bottom:22px;right:22px;background:#1e293b;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:999;transform:translateY(80px);opacity:0;transition:all .3s; }
    .toast.show { transform:translateY(0);opacity:1; }
    .toast.success { border-left:4px solid #059669; }
    .toast.error   { border-left:4px solid #dc2626; }
    .toast.info    { border-left:4px solid #3b82f6; }
    .toast.warning { border-left:4px solid #d97706; }

    /* ── UPLOAD ── */
    .upload-area { border:2px dashed #cbd5e1;border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:#f8fafc; }
    .upload-area:hover,.upload-area.dragover { border-color:#3b82f6;background:#eff6ff; }

    /* ── COURSE CARD ── */
    .course-card { background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;transition:transform .18s,box-shadow .18s; }
    .course-card:hover { transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.1); }
    .cc-img { height:110px;display:flex;align-items:center;justify-content:center;font-size:42px; }
    .cc-body { padding:14px; }
    .cc-title { font-size:14px;font-weight:700;color:#1e293b;margin-bottom:4px; }
    .cc-meta { font-size:12px;color:#64748b;margin-bottom:3px; }

    /* ── AVATAR COLORS ── */
    .av-blue   { background:linear-gradient(135deg,#3b82f6,#6366f1) !important; }
    .av-green  { background:linear-gradient(135deg,#059669,#10b981) !important; }
    .av-purple { background:linear-gradient(135deg,#7c3aed,#a78bfa) !important; }
    .av-red    { background:linear-gradient(135deg,#dc2626,#f87171) !important; }
    .av-yellow { background:linear-gradient(135deg,#d97706,#fbbf24) !important; }

    /* ── MISC ── */
    .divide-y > * + * { border-top:1px solid #f1f5f9; }
    .gap-1{gap:4px} .gap-2{gap:8px} .gap-3{gap:12px} .gap-4{gap:16px} .gap-6{gap:24px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr)} .grid-3{display:grid;grid-template-columns:repeat(3,1fr)} .grid-4{display:grid;grid-template-columns:repeat(4,1fr)}
    .flex{display:flex} .items-center{align-items:center} .items-start{align-items:flex-start} .justify-between{justify-content:space-between} .flex-1{flex:1} .flex-wrap{flex-wrap:wrap} .shrink-0{flex-shrink:0} .ml-auto{margin-left:auto} .truncate{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
    .mb-2{margin-bottom:8px} .mb-3{margin-bottom:12px} .mb-4{margin-bottom:16px} .mb-6{margin-bottom:24px} .mt-1{margin-top:4px} .mt-2{margin-top:8px} .mt-4{margin-top:16px} .mx-auto{margin-left:auto;margin-right:auto}
    .p-4{padding:16px} .p-5{padding:20px} .p-6{padding:24px} .px-4{padding-left:16px;padding-right:16px} .py-2{padding-top:8px;padding-bottom:8px} .py-3{padding-top:12px;padding-bottom:12px}
    .text-xs{font-size:11px} .text-sm{font-size:13px} .text-lg{font-size:17px} .text-xl{font-size:20px} .text-2xl{font-size:24px} .font-semibold{font-weight:600} .font-bold{font-weight:700} .font-black{font-weight:900} .text-center{text-align:center}
    .hidden{display:none!important}
    @media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.content-area{margin-left:0}.main-content{padding:14px}.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.hide-mobile{display:none!important}.qa-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="app-wrap">

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-ic">🏛️</div>
      <div><div class="logo-txt">UniPlataforma</div><div class="logo-sub">Sistema Integrado</div></div>
    </div>
    <div class="sidebar-user">
      <div class="s-avatar" id="nav-avatar">?</div>
      <div style="flex:1;min-width:0">
        <div class="s-name" id="nav-name">Cargando...</div>
        <div class="s-role" id="nav-role"></div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-foot">
      <button class="btn-logout" onclick="AUTH.logout()">🚪 Cerrar Sesión</button>
    </div>
  </aside>

  <!-- ═══════════ CONTENT ═══════════ -->
  <div class="content-area">

    <!-- TOPBAR -->
    <header class="topbar">
      <button class="ic-btn" id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none">☰</button>
      <div>
        <div class="tb-title" id="page-title">Dashboard</div>
        <div class="tb-sub" id="page-subtitle">Bienvenido al sistema</div>
      </div>
      <div class="tb-actions">
        <div class="tb-search hide-mobile">
          🔍 <input type="text" placeholder="Buscar..."/>
        </div>
        <div class="ic-btn" onclick="toggleNotif()">🔔<span class="dot"></span></div>
        <div class="tb-user" onclick="showView('perfil')">
          <div class="tb-av" id="topbar-avatar"></div>
          <span class="tb-name hide-mobile" id="topbar-name">...</span>
          <span style="font-size:10px;color:#94a3b8">▾</span>
        </div>
      </div>
    </header>

    <!-- MAIN VIEWS -->
    <main class="main-content">
      <div id="view-home"      class="view active"></div>
      <div id="view-academico" class="view"></div>
      <div id="view-lms"       class="view"></div>
      <div id="view-admin"     class="view"></div>
      <div id="view-perfil"    class="view"></div>
    </main>
  </div>
</div>

<!-- NOTIF PANEL -->
<div class="notif-panel" id="notif-panel">
  <div class="notif-head">
    <span>Notificaciones</span>
    <button onclick="document.getElementById('notif-panel').classList.remove('open')">✕ Cerrar</button>
  </div>
  <div id="notif-list"></div>
</div>

<!-- MODAL -->
<div class="modal-ov" id="global-modal">
  <div class="modal-box">
    <div class="modal-hd">
      <span class="modal-ttl" id="modal-title">Título</span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-bd" id="modal-body"></div>
    <div class="modal-ft" id="modal-footer"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span id="toast-icon">✅</span>
  <span id="toast-msg"></span>
</div>

<script src="assets/js/auth.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
