<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniPlataforma — Inicio de Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900">

  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    <div class="particle particle-4"></div>
  </div>

  <div class="relative z-10 w-full max-w-md px-6">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-2xl mb-4">
        <i class="fas fa-university text-blue-800 text-3xl"></i>
      </div>
      <h1 class="text-white text-3xl font-bold tracking-tight">UniPlataforma</h1>
      <p class="text-blue-200 text-sm mt-1">Sistema Integrado de Gestión Universitaria</p>
    </div>

    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-gray-800 text-xl font-semibold mb-6 text-center">Iniciar Sesión</h2>

      <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 mb-4 text-sm flex items-center gap-2">
        <i class="fas fa-exclamation-circle"></i>
        <span id="login-error-msg">Usuario o contraseña incorrectos.</span>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de usuario</label>
          <select id="role-select" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
            <option value="">Selecciona tu rol...</option>
            <option value="estudiante">Estudiante</option>
            <option value="profesor">Profesor</option>
            <option value="admin">Administrador</option>
            <option value="talento_humano">Talento Humano</option>
            <option value="contabilidad">Contabilidad</option>
            <option value="rectoria">Rectoría</option>
            <option value="planeacion">Planeación</option>
            <option value="bienestar">Bienestar Universitario</option>
            <option value="registro">Registro y Control</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Usuario / Código</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><i class="fas fa-user text-sm"></i></span>
            <input id="username" type="text" placeholder="Ej: EST001 o ADMIN"
              class="w-full border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><i class="fas fa-lock text-sm"></i></span>
            <input id="password" type="password" placeholder="••••••••"
              class="w-full border border-gray-300 rounded-lg pl-10 pr-10 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            <button type="button" id="toggle-pass" class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600">
              <i class="fas fa-eye text-sm"></i>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
            <input type="checkbox" class="rounded border-gray-300 text-blue-600"/> Recordarme
          </label>
          <a href="#" class="text-blue-600 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit"
          class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-2">
          <i class="fas fa-sign-in-alt"></i> Ingresar
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-gray-100">
        <p class="text-xs text-gray-500 text-center mb-3 font-medium">CREDENCIALES DE DEMOSTRACIÓN</p>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setDemo('estudiante','EST001','123456')" class="bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 text-xs py-1.5 px-2 rounded-lg transition">
            <i class="fas fa-user-graduate mr-1"></i> Estudiante
          </button>
          <button onclick="setDemo('profesor','PROF001','123456')" class="bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100 text-xs py-1.5 px-2 rounded-lg transition">
            <i class="fas fa-chalkboard-teacher mr-1"></i> Profesor
          </button>
          <button onclick="setDemo('admin','ADMIN','admin123')" class="bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 text-xs py-1.5 px-2 rounded-lg transition">
            <i class="fas fa-user-shield mr-1"></i> Admin
          </button>
          <button onclick="setDemo('rectoria','RECTOR','rector123')" class="bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 text-xs py-1.5 px-2 rounded-lg transition">
            <i class="fas fa-crown mr-1"></i> Rectoría
          </button>
        </div>
      </div>
    </div>

    <p class="text-center text-blue-200 text-xs mt-6">© 2026 UniPlataforma · Todos los derechos reservados</p>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
