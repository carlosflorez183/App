<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniPlataforma — Inicio de Sesión</title>
  <link rel="stylesheet" href="assets/css/uni.css"/>
  <link rel="stylesheet" href="assets/css/main.css"/>
  <style>
    /* ---- Estilos específicos de login ---- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, Arial, sans-serif; }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #312e81 100%);
      position: relative;
      overflow: hidden;
      padding: 24px;
    }

    /* Partículas decorativas */
    .particle { position: absolute; border-radius: 50%; opacity: .12; animation: float 8s infinite ease-in-out; }
    .p1 { width:300px;height:300px;background:#60a5fa;top:-80px;left:-80px;animation-delay:0s; }
    .p2 { width:200px;height:200px;background:#818cf8;bottom:40px;right:-60px;animation-delay:2s; }
    .p3 { width:140px;height:140px;background:#34d399;top:42%;left:64%;animation-delay:4s; }
    .p4 { width:100px;height:100px;background:#f472b6;top:63%;left:6%;animation-delay:6s; }
    @keyframes float { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-18px) scale(1.05)} }

    /* Card */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    /* Logo / encabezado */
    .login-head {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-head .logo-circle {
      width: 76px; height: 76px;
      background: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      font-size: 32px;
    }
    .login-head h1 { color: white; font-size: 28px; font-weight: 900; }
    .login-head p  { color: rgba(255,255,255,.7); font-size: 13px; margin-top: 4px; }

    /* Card blanca */
    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      padding: 32px;
    }
    .login-card h2 { font-size: 18px; font-weight: 700; color: #1e293b; text-align: center; margin-bottom: 22px; }

    /* Error */
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 13px;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .error-box.show { display: flex; }

    /* Campos */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    .field select,
    .field input[type="text"],
    .field input[type="password"] {
      width: 100%;
      border: 1.5px solid #d1d5db;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 14px;
      color: #1e293b;
      background: #f9fafb;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      font-family: inherit;
    }
    .field input:focus, .field select:focus {
      border-color: #3b82f6;
      background: white;
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }
    .field .input-row {
      position: relative;
    }
    .field .input-row .ico {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      pointer-events: none;
    }
    .field .input-row input {
      padding-left: 36px;
    }
    .field .input-row .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: #94a3b8;
      padding: 4px;
    }
    .field .input-row .eye-btn:hover { color: #64748b; }

    .row-check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 18px;
      color: #64748b;
    }
    .row-check label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .row-check a { color: #2563eb; text-decoration: none; }
    .row-check a:hover { text-decoration: underline; }

    /* Botón ingresar */
    .btn-login {
      width: 100%;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover { background: #1e40af; }
    .btn-login:active { transform: scale(.98); }
    .btn-login.loading { background: #059669; pointer-events: none; }

    /* Separador */
    .sep {
      margin: 20px 0 14px;
      border-top: 1px solid #e5e7eb;
      position: relative;
      text-align: center;
    }
    .sep span {
      position: relative;
      top: -9px;
      background: white;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      color: #9ca3af;
      letter-spacing: .5px;
    }

    /* Botones demo */
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .demo-btn {
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      border: 1.5px solid;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      font-family: inherit;
    }
    .d-green  { background:#f0fdf4;color:#15803d;border-color:#bbf7d0; }
    .d-green:hover  { background:#dcfce7; }
    .d-purple { background:#faf5ff;color:#6d28d9;border-color:#d8b4fe; }
    .d-purple:hover { background:#ede9fe; }
    .d-blue   { background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe; }
    .d-blue:hover   { background:#dbeafe; }
    .d-red    { background:#fef2f2;color:#b91c1c;border-color:#fecaca; }
    .d-red:hover    { background:#fee2e2; }

    /* Footer */
    .login-footer { text-align: center; color: rgba(255,255,255,.5); font-size: 11px; margin-top: 18px; }
  </style>
</head>
<body>
<div class="login-page">
  <!-- Partículas -->
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>

  <div class="login-wrap">
    <!-- Encabezado -->
    <div class="login-head">
      <div class="logo-circle">🏛️</div>
      <h1>UniPlataforma</h1>
      <p>Sistema Integrado de Gestión Universitaria</p>
    </div>

    <!-- Card -->
    <div class="login-card">
      <h2>Iniciar Sesión</h2>

      <div class="error-box" id="login-error">
        ⚠️ <span id="login-error-msg">Usuario o contraseña incorrectos.</span>
      </div>

      <form id="login-form">
        <div class="field">
          <label>Tipo de usuario</label>
          <select id="role-select">
            <option value="">Selecciona tu rol...</option>
            <option value="estudiante">Estudiante</option>
            <option value="profesor">Profesor</option>
            <option value="admin">Administrador</option>
            <option value="talento_humano">Talento Humano</option>
            <option value="contabilidad">Contabilidad</option>
            <option value="rectoria">Rectoría</option>
            <option value="planeacion">Planeación</option>
            <option value="bienestar">Bienestar Universitario</option>
            <option value="registro">Registro y Control</option>
          </select>
        </div>

        <div class="field">
          <label>Usuario / Código</label>
          <div class="input-row">
            <span class="ico">👤</span>
            <input id="username" type="text" placeholder="Ej: EST001 o ADMIN"/>
          </div>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <div class="input-row">
            <span class="ico">🔒</span>
            <input id="password" type="password" placeholder="••••••••"/>
            <button type="button" class="eye-btn" id="toggle-pass">👁</button>
          </div>
        </div>

        <div class="row-check">
          <label><input type="checkbox"/> Recordarme</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span>➤</span> Ingresar
        </button>
      </form>

      <div class="sep"><span>CREDENCIALES DE DEMOSTRACIÓN</span></div>

      <div class="demo-grid">
        <button class="demo-btn d-green"  onclick="setDemo('estudiante','EST001','123456')">🎓 Estudiante</button>
        <button class="demo-btn d-purple" onclick="setDemo('profesor','PROF001','123456')">👩‍🏫 Profesor</button>
        <button class="demo-btn d-blue"   onclick="setDemo('admin','ADMIN','admin123')">🛡️ Admin</button>
        <button class="demo-btn d-red"    onclick="setDemo('rectoria','RECTOR','rector123')">👑 Rectoría</button>
      </div>
    </div>

    <p class="login-footer">© 2026 UniPlataforma · Todos los derechos reservados</p>
  </div>
</div>

<script src="assets/js/auth.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
