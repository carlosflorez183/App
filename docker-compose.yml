# =============================================
#  UniPlataforma — stack completo
#
#  app    -> interfaz (nginx)          http://localhost:8080
#  api    -> Fastify + Prisma          http://localhost:3000
#  db     -> PostgreSQL 16             localhost:5432
#
#  La API no arranca hasta que el esquema existe y el seed terminó.
# =============================================

services:
  db:
    image: postgres:16-alpine
    container_name: uni-db
    environment:
      POSTGRES_USER: uni
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uni_dev_password}
      POSTGRES_DB: uni_plataforma
    ports:
      - "5432:5432"
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uni -d uni_plataforma"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Tarea de un solo uso: crea el esquema y siembra los datos de demostración.
  # Si la base ya tiene datos, el seed los reemplaza.
  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: uni-plataforma-api
    container_name: uni-seed
    command: sh -c "npx prisma generate && npx prisma db push --skip-generate && node prisma/seed.js"
    environment:
      DATABASE_URL: postgresql://uni:${DB_PASSWORD:-uni_dev_password}@db:5432/uni_plataforma
      MOCK_DATA_PATH: /app/mock/mockData.js
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: uni-plataforma-api
    container_name: uni-api
    environment:
      DATABASE_URL: postgresql://uni:${DB_PASSWORD:-uni_dev_password}@db:5432/uni_plataforma
      JWT_SECRET: ${JWT_SECRET:-uni-plataforma-dev-secret-cambiar-en-produccion}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: uni-plataforma
    container_name: uni-plataforma
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  datos-db:
