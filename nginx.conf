server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # En nginx, un add_header dentro de un location descarta los del nivel
  # superior: no se heredan, se reemplazan. Por eso los headers de seguridad
  # se repiten en cada location que define sus propios headers.
  #
  # La app usa BrowserRouter: /admin, /admisiones, /docente, etc. no son
  # archivos reales, asi que cualquier ruta desconocida devuelve index.html
  # y deja que el router la resuelva en el cliente.
  location / {
    try_files $uri $uri/ /index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # La API corre en otro contenedor. El navegador llama al mismo origen (/api),
  # así no hay CORS ni URLs de backend incrustadas en el bundle.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los assets con hash en el nombre se pueden cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # index.html no debe cachearse: si no, los usuarios siguen viendo bundles viejos.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # El smoke test y la prueba de acciones son herramientas de desarrollo, no
  # deben salir en produccion.
  location = /smoke.html {
    return 404;
  }

  location = /prueba-acciones.html {
    return 404;
  }

  # Tampoco sus scripts: en el build de produccion Vite los renombra, pero
  # si alguien los compila a mano no deben quedar accesibles.
  location = /src/prueba-acciones.jsx {
    return 404;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server_tokens off;
}
